name: Docker Publish

# Builds and publishes the Broiler.SDK CI containers to GitHub Container Registry (ghcr.io):
#   - base:    Ubuntu Latest with latest .NET 10.0 SDK & NativeAOT C/C++ toolchain
#   - browser: Chromium headless via Playwright, checkout of test262 and WPT
#   - office:  LibreOffice headless, poppler PDF tools, pinned fonts, and sw/qa/extras testcases
#
# Triggered on pushes to main modifying docker/**, pull requests for validation,
# or manual workflow dispatch.

on:
  push:
    branches: [main]
    paths:
      - 'docker/**'
      - '.github/workflows/docker-publish.yml'
  pull_request:
    paths:
      - 'docker/**'
      - '.github/workflows/docker-publish.yml'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag (e.g., latest, 0.1.0-preview.1)'
        required: false
        default: 'latest'
      push:
        description: 'Push images to GitHub Container Registry (ghcr.io)'
        type: boolean
        required: false
        default: true

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  prepare:
    name: Resolve build configuration
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      push: ${{ steps.resolve.outputs.push }}
      owner: ${{ steps.resolve.outputs.owner }}
    steps:
      - name: Resolve parameters
        id: resolve
        shell: bash
        run: |
          # Lowercase the owner name for docker registry compatibility
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          TAG="${{ github.event.inputs.tag || 'latest' }}"

          PUSH=false
          if [ "${{ github.event_name }}" = "push" ]; then
            PUSH=true
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            PUSH="${{ github.event.inputs.push }}"
          fi

          echo "owner=${OWNER}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "push=${PUSH}" >> "$GITHUB_OUTPUT"

  build-base:
    name: Build & publish 'base' (.NET 10 SDK)
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: needs.prepare.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push base image
        uses: docker/build-push-action@v6
        with:
          context: docker/base
          file: docker/base/Dockerfile
          push: ${{ needs.prepare.outputs.push == 'true' }}
          load: ${{ needs.prepare.outputs.push != 'true' }}
          tags: |
            ${{ env.REGISTRY }}/${{ needs.prepare.outputs.owner }}/broiler-sdk-base:${{ needs.prepare.outputs.tag }}
            ${{ env.REGISTRY }}/${{ needs.prepare.outputs.owner }}/broiler-sdk-base:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ needs.prepare.outputs.owner }}/base:${{ needs.prepare.outputs.tag }}
          cache-from: type=gha,scope=docker-base
          cache-to: type=gha,mode=max,scope=docker-base

      - name: Smoke test base image
        run: |
          docker run --rm ${{ env.REGISTRY }}/${{ needs.prepare.outputs.owner }}/broiler-sdk-base:${{ needs.prepare.outputs.tag }} dotnet --info

  build-browser:
    name: Build & publish 'browser' (Chromium, Playwright, test262, WPT)
    needs: [prepare, build-base]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: needs.prepare.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push browser image
        uses: docker/build-push-action@v6
        with:
          context: docker/browser
          file: docker/browser/Dockerfile
          build-args: |
            BASE_IMAGE=${{ env.REGISTRY }}/${{ needs.prepare.outputs.owner }}/broiler-sdk-base:${{ needs.prepare.outputs.tag }}
          push: ${{ needs.prepare.outputs.push == 'true' }}
          load: ${{ needs.prepare.outputs.push != 'true' }}
          tags: |
            ${{ env.REGISTRY }}/${{ needs.prepare.outputs.owner }}/broiler-sdk-browser:${{ needs.prepare.outputs.tag }}
            ${{ env.REGISTRY }}/${{ needs.prepare.outputs.owner }}/broiler-sdk-browser:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ needs.prepare.outputs.owner }}/browser:${{ needs.prepare.outputs.tag }}
          cache-from: type=gha,scope=docker-browser
          cache-to: type=gha,mode=max,scope=docker-browser

      - name: Smoke test browser image
        run: |
          docker run --rm ${{ env.REGISTRY }}/${{ needs.prepare.outputs.owner }}/broiler-sdk-browser:${{ needs.prepare.outputs.tag }} \
            bash -c "node --version && npx playwright --version && test -d /opt/test262/test && test -d /opt/wpt/css"

  build-office:
    name: Build & publish 'office' (LibreOffice, PDF tools, fonts, testcases)
    needs: [prepare, build-base]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: needs.prepare.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push office image
        uses: docker/build-push-action@v6
        with:
          context: docker/office
          file: docker/office/Dockerfile
          build-args: |
            BASE_IMAGE=${{ env.REGISTRY }}/${{ needs.prepare.outputs.owner }}/broiler-sdk-base:${{ needs.prepare.outputs.tag }}
          push: ${{ needs.prepare.outputs.push == 'true' }}
          load: ${{ needs.prepare.outputs.push != 'true' }}
          tags: |
            ${{ env.REGISTRY }}/${{ needs.prepare.outputs.owner }}/broiler-sdk-office:${{ needs.prepare.outputs.tag }}
            ${{ env.REGISTRY }}/${{ needs.prepare.outputs.owner }}/broiler-sdk-office:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ needs.prepare.outputs.owner }}/office:${{ needs.prepare.outputs.tag }}
          cache-from: type=gha,scope=docker-office
          cache-to: type=gha,mode=max,scope=docker-office

      - name: Smoke test office image
        run: |
          docker run --rm ${{ env.REGISTRY }}/${{ needs.prepare.outputs.owner }}/broiler-sdk-office:${{ needs.prepare.outputs.tag }} \
            bash -c "soffice --version && pdftoppm -v 2>&1 | head -n 1 && fc-list : family | grep -i Liberation | head -n 2 && test -d /opt/libreoffice-extras"
