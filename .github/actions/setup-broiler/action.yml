name: Set up Broiler.Code
description: >-
  Installs the .NET SDK. Component dependencies restore as NuGet packages from
  the sources in NuGet.config; a normal actions/checkout is sufficient.

inputs:
  dotnet-version:
    description: .NET SDK version to install.
    required: false
    default: '10.0.x'

runs:
  using: composite
  steps:
    - name: Set up .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: ${{ inputs.dotnet-version }}
