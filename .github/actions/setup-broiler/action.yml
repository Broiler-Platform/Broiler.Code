name: Set up Broiler.Code
description: >-
  Initialises the nested component submodules the Broiler Code project closure
  reaches, and installs the .NET SDK. Run this after actions/checkout with
  `submodules: true` — a local action cannot perform the checkout itself,
  because its own files have to be in the workspace first.

inputs:
  dotnet-version:
    description: .NET SDK version to install.
    required: false
    default: '10.0.x'

runs:
  using: composite
  steps:
    # `submodules: true` on the checkout fetches the four top-level components only.
    # Each component repository also carries nested checkouts of its own dependencies,
    # because its projects reference those nested copies by literal relative path so
    # that the component still builds standalone. The lines below are exactly the
    # nested checkouts this repository's project closure reaches, and no more:
    #
    #   Broiler.Graphics   its projects take the image abstraction from its own Media.
    #   Broiler.UI         every control reaches Graphics and Input through its own
    #                      copies.
    #   …/Broiler.Graphics and that Graphics copy in turn needs its own Media.
    #
    # Broiler.UI/Broiler.Documents is deliberately absent: no control in the closure
    # reaches it, so initialising it would clone a component nothing here builds.
    #
    # Order matters: a parent has to be initialised before its own nested submodule can be.
    #
    # Naming them beats `--recursive`: the Graphics <-> Media reference is mutual, so a
    # recursive init descends several levels further than anything here builds against.
    #
    # Every line is load-bearing. A ProjectReference to a missing project is only a
    # restore *warning*; the build then fails later on missing types.
    - name: Initialise nested submodules
      shell: bash
      run: |
        git -C Broiler.Graphics submodule update --init Broiler.Media
        git -C Broiler.UI submodule update --init Broiler.Graphics Broiler.Input
        git -C Broiler.UI/Broiler.Graphics submodule update --init Broiler.Media

    - name: Set up .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: ${{ inputs.dotnet-version }}
