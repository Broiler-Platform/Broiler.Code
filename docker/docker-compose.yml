services:
  base:
    image: ${REGISTRY:-ghcr.io}/${OWNER:-broiler-platform}/broiler-sdk-base:${TAG:-latest}
    build:
      context: ./base
      dockerfile: Dockerfile
      args:
        UBUNTU_VERSION: latest
        DOTNET_CHANNEL: "10.0"

  browser:
    image: ${REGISTRY:-ghcr.io}/${OWNER:-broiler-platform}/broiler-sdk-browser:${TAG:-latest}
    build:
      context: ./browser
      dockerfile: Dockerfile
      args:
        BASE_IMAGE: ${REGISTRY:-ghcr.io}/${OWNER:-broiler-platform}/broiler-sdk-base:${TAG:-latest}
        NODE_MAJOR: "22"
        PLAYWRIGHT_VERSION: "1.59.1"
        TEST262_REPO: https://github.com/tc39/test262.git
        TEST262_REF: ccaac100ff49d81e9ff47a75ff4c60e0bd3f262e
        WPT_REPO: https://github.com/web-platform-tests/wpt.git
        WPT_REF: master
    depends_on:
      - base

  office:
    image: ${REGISTRY:-ghcr.io}/${OWNER:-broiler-platform}/broiler-sdk-office:${TAG:-latest}
    build:
      context: ./office
      dockerfile: Dockerfile
      args:
        BASE_IMAGE: ${REGISTRY:-ghcr.io}/${OWNER:-broiler-platform}/broiler-sdk-base:${TAG:-latest}
        LO_CORE_REPO: https://github.com/LibreOffice/core.git
        LO_CORE_BRANCH: master
    depends_on:
      - base
